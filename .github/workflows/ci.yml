name: CI

on:
  pull_request:
    branches: [main, qa, dev]
  push:
    branches: [main, qa, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Free org plan: hosted minutes are billed per job. Four parallel pnpm installs
# used ~4× the install time. One job = one install. See
# docs/delivery/GITHUB_ACTIONS_FREE.md
jobs:
  ci:
    name: ci
    runs-on: [self-hosted, dev-runner]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: lockfile
        run: node scripts/check-lockfile.mjs

      - name: merge-main
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-tree --write-tree origin/main HEAD >/dev/null; then
            echo "::error::This branch conflicts with origin/main. Merge main into this branch before landing."
            git merge-tree --write-tree --messages origin/main HEAD || true
            exit 1
          fi

      - name: compose config
        run: docker compose -f infra/docker/docker-compose.yml --profile apps --env-file .env.example config

      - uses: ./.github/actions/setup-node-pnpm

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test:unit

      - name: build
        # kvm2 self-hosted runner is 2 vCPU/8GB and also runs the live dev stack —
        # turbo's default concurrency builds multiple Next.js apps in parallel and
        # OOM-kills under that memory pressure. Force one package at a time.
        run: pnpm build -- --concurrency=1

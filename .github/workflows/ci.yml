name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/contracts build
      - run: pnpm --filter @smart/api-core db:generate
        env:
          DATABASE_URL: postgresql://smart:smart@127.0.0.1:5432/smart?schema=public
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/contracts build
      - run: pnpm --filter @smart/api-core db:generate
        env:
          DATABASE_URL: postgresql://smart:smart@127.0.0.1:5432/smart?schema=public
      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/contracts build
      - run: pnpm --filter @smart/api-core db:generate
        env:
          DATABASE_URL: postgresql://smart:smart@127.0.0.1:5432/smart?schema=public
      - name: Unit tests (Vitest)
        run: pnpm test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart/contracts build
      - run: pnpm --filter @smart/api-core db:generate
        env:
          DATABASE_URL: postgresql://smart:smart@127.0.0.1:5432/smart?schema=public
      - name: Build
        run: pnpm build

  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/docker-compose.yml --profile apps config

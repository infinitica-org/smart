name: smart

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?schema=public
  POOLED_DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@pgbouncer:6432/smart?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-now!!}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smart}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartsecret}
  S3_BUCKET: smart
  # S6-VV-119: `required` only after MinIO has a KMS key and the bucket encrypts by default.
  S3_ENCRYPTION: ${S3_ENCRYPTION:-off}
  LOG_PRETTY: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: SMART Platform <noreply@smart.local>
  AUTH_APP_URL: ${AUTH_APP_URL:-http://localhost:3005}
  STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:3001}
  TPO_APP_URL: ${TPO_APP_URL:-http://localhost:3002}
  ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3003}
  COMPANY_APP_URL: ${COMPANY_APP_URL:-http://localhost:3006}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MONTHLY_CEILING_USD: ${AI_MONTHLY_CEILING_USD:-500}
  PROCTORING_FULL: ${PROCTORING_FULL:-true}
  PROCTORING_CV_URL: ${PROCTORING_CV_URL:-http://proctoring-cv:8091}
  PROCTORING_CV_PROVIDER: ${PROCTORING_CV_PROVIDER:-stub}
  # Opt-in: unset by default. Set to http://tempo:4318 (only meaningful with
  # the `obs` profile also up) to export traces; see infra/observability/README.md.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: smart
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-mode connection pooler in front of postgres. The `api`
  # container's runtime pool (PrismaPg, one `pg.Pool` per process) talks to
  # this instead of postgres directly once POOLED_DATABASE_URL is set —
  # `prisma migrate deploy` keeps using DATABASE_URL (direct to postgres),
  # since transaction pooling doesn't support the session-level features
  # migrations need. See docs/delivery/DATABASE.md.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${POSTGRES_PASSWORD:-smart} psql -h 127.0.0.1 -p 6432 -U smart -d smart -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # AOF (fsync every second) instead of relying on RDB snapshot intervals —
  # candidate assessment session state (session:assessment:{attempt_id})
  # changes continuously; without this, a crash between snapshots could lose
  # several minutes of an in-progress attempt instead of at most ~1s.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy",
        "volatile-lru",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    ports:
      # Host 6380 — Windows often already binds 6379 (svchost/WSL), which ECONNRESETs ioredis.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
      # --mode dev-container bundles --unsafe-bypass-fsync=true (acks writes
      # before they hit disk) along with the auto-topic-creation/low-memory
      # properties we still want. Override just the fsync bypass — a later
      # explicit flag wins over the bundle — so a crash/power-loss can't
      # silently drop "committed" Kafka messages. Verified: this still starts
      # cleanly with auto_create_topics_enabled intact.
      - --unsafe-bypass-fsync=false
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eiq 'Healthy|ok'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smart}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartsecret}
      # Community MinIO: global CORS only (per-bucket mc cors set requires AIStor).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001,https://dev.app.becomesmart.online}
      # Metrics scraped in-network only (127.0.0.1-bound Prometheus) — public
      # auth mode is acceptable here, but do not expose this port beyond that.
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # S6-VV-119: `<key-name>:<base64 32 bytes>` turns on SSE-S3. Empty = no KMS (today's behavior).
      # LOSING THIS KEY MAKES EVERY ENCRYPTED OBJECT UNREADABLE. See docs/delivery/STORAGE_ENCRYPTION.md.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: provisions the "smart" bucket so a fresh stack never hits
  # NoSuchBucket on first upload. Idempotent (--ignore-existing) and exits
  # after running — StorageService also self-heals this on boot as a
  # second-layer guard for anyone running MinIO outside this compose file.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # S6-VV-119: only a flag, never the key itself.
      KMS_ENABLED: ${MINIO_KMS_SECRET_KEY:+true}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-smart} ${MINIO_ROOT_PASSWORD:-smartsecret} &&
      mc mb --ignore-existing local/smart &&
      if [ \"$$KMS_ENABLED\" = true ]; then mc encrypt set sse-s3 local/smart; fi
      "

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8025/api/v1/info",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prisma Studio — browse / edit Postgres rows against the live schema.
  # UI: http://localhost:5555  (also: pnpm db:studio on the host)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.prisma-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../apps/api-core/prisma:/app/prisma:ro
      - ../../apps/api-core/prisma.config.ts:/app/prisma.config.ts:ro
    environment:
      DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?schema=public
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy

  # Adminer — lightweight SQL browser, alternative to Prisma Studio for raw
  # queries/table admin. Reachable at db.<domain> via Caddy (same Basic Auth
  # gate as Prisma Studio — DB_BASIC_AUTH_USER/HASH — plus the Postgres login
  # itself). Not started under the bare laptop profile-less stack; only when
  # the `apps` profile (VPS stacks) is up, matching the other web services.
  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["apps"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    profiles: ["apps"]

  proctoring-cv:
    build:
      context: ../../apps/proctoring-cv
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROCTORING_CV_PROVIDER: ${PROCTORING_CV_PROVIDER:-real}
      PROCTORING_CV_PORT: "8091"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-smart}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${PROCTORING_CV_PORT:-8091}:8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
    profiles: ["apps"]

  web-student:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-student
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${STUDENT_PORT:-3001}:3000"
    profiles: ["apps"]

  web-tpo:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-tpo
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${TPO_PORT:-3002}:3000"
    profiles: ["apps"]

  web-admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-admin
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3003}:3000"
    profiles: ["apps"]

  web-verify:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-verify
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${VERIFY_PORT:-3004}:3000"
    profiles: ["apps"]

  web-auth:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-auth
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${AUTH_PORT:-3005}:3000"
    profiles: ["apps"]

  # S6-VV-147 — employer portal (was built by CI but never deployed).
  web-company:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-company
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMPANY_URL: ${COMPANY_APP_URL:-http://localhost:3006}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${COMPANY_PORT:-3006}:3000"
    profiles: ["apps"]

  # S6-VV-97 — nightly encrypted, off-box backup of Postgres + MinIO objects.
  # Idles (smart_backup_enabled 0) until BACKUP_ENABLED=true and the BACKUP_*
  # vars are set; see docs/delivery/BACKUP_RESTORE.md. On demand:
  #   docker compose ... --profile vps run --rm backup backup.sh
  backup:
    build:
      context: ../backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_ENV_NAME: ${BACKUP_ENV_NAME:-local}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 20 * * *}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DEST: ${BACKUP_DEST:-offsite:smart-backups}
      BACKUP_INCLUDE_OBJECTS: ${BACKUP_INCLUDE_OBJECTS:-true}
      PGHOST: postgres
      PGUSER: smart
      PGDATABASE: smart
      PGPASSWORD: ${POSTGRES_PASSWORD:-smart}
      MINIO_BUCKET: smart
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-smart}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-smartsecret}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Upload without needing bucket-create/list-buckets permission.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backup_work:/work
      - backup_metrics:/metrics
    profiles: ["vps"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDENT_HOST: ${STUDENT_HOST:-app.localhost}
      TPO_HOST: ${TPO_HOST:-tpo.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      VERIFY_HOST: ${VERIFY_HOST:-verify.localhost}
      AUTH_HOST: ${AUTH_HOST:-auth.localhost}
      COMPANY_HOST: ${COMPANY_HOST:-company.localhost}
      API_HOST: ${API_HOST:-api.localhost}
      STUDIO_HOST: ${STUDIO_HOST:-studio.localhost}
      DB_HOST: ${DB_HOST:-db.localhost}
      DB_BASIC_AUTH_USER: ${DB_BASIC_AUTH_USER:-admin}
      DB_BASIC_AUTH_HASH: ${DB_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web-student
      - web-tpo
      - web-admin
      - web-verify
      - web-auth
      - web-company
      - prisma-studio
      - adminer
    # Only one stack per host should enable profile `vps` (binds :80/:443).
    profiles: ["vps"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # --web.enable-remote-write-receiver: lets k6's Prometheus remote-write
    # output (tools/load-tests) push live VU/RPS/latency metrics during a run —
    # see tools/load-tests/README.md. Loopback-only exposure (127.0.0.1 below)
    # keeps this an acceptable local/CI trade-off.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-smart}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      # Host 3100 (not 3030) — keep Loki on 3101 to avoid collision.
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3101}:3100"
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: ["obs"]

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3103}:3200" # query API (Grafana datasource)
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC ingest
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP ingest
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]
    # No app currently emits OTel traces to this — wiring an OTel SDK into
    # api-core (and pointing it at http://tempo:4318) is a separate task.
    # If /var/tempo permission errors show up on first boot, add `user: root`.

  # --- exporters: turn existing containers/services into Prometheus targets ---

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true # needed for full cgroup/device metrics on cgroup v2 hosts
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8085}:8080"
    profiles: ["obs"]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - backup_metrics:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # S6-VV-97: exposes smart_backup_* written by the backup service.
      - --collector.textfile.directory=/textfile
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9101}:9100"
    profiles: ["obs"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    profiles: ["obs"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    profiles: ["obs"]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  backup_work:
  backup_metrics:

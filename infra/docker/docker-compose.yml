name: smart

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?schema=public
  POOLED_DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@pgbouncer:6432/smart?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-now!!}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smart}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartsecret}
  S3_BUCKET: smart
  LOG_PRETTY: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: SMART Platform <noreply@smart.local>
  AUTH_APP_URL: ${AUTH_APP_URL:-http://localhost:3005}
  STUDENT_APP_URL: ${STUDENT_APP_URL:-http://localhost:3001}
  TPO_APP_URL: ${TPO_APP_URL:-http://localhost:3002}
  ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:3003}
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MONTHLY_CEILING_USD: ${AI_MONTHLY_CEILING_USD:-500}
  PROCTORING_FULL: ${PROCTORING_FULL:-true}
  PROCTORING_CV_URL: ${PROCTORING_CV_URL:-http://proctoring-cv:8091}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: smart
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction-mode connection pooler in front of postgres. The `api`
  # container's runtime pool (PrismaPg, one `pg.Pool` per process) talks to
  # this instead of postgres directly once POOLED_DATABASE_URL is set —
  # `prisma migrate deploy` keeps using DATABASE_URL (direct to postgres),
  # since transaction pooling doesn't support the session-level features
  # migrations need. See docs/delivery/DATABASE.md.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=${POSTGRES_PASSWORD:-smart} psql -h 127.0.0.1 -p 6432 -U smart -d smart -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "volatile-lru",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    ports:
      # Host 6380 — Windows often already binds 6379 (svchost/WSL), which ECONNRESETs ioredis.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eiq 'Healthy|ok'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smart}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartsecret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: provisions the "smart" bucket so a fresh stack never hits
  # NoSuchBucket on first upload. Idempotent (--ignore-existing) and exits
  # after running — StorageService also self-heals this on boot as a
  # second-layer guard for anyone running MinIO outside this compose file.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-smart} ${MINIO_ROOT_PASSWORD:-smartsecret} &&
      mc mb --ignore-existing local/smart
      "

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8025/api/v1/info",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prisma Studio — browse / edit Postgres rows against the live schema.
  # UI: http://localhost:5555  (also: pnpm db:studio on the host)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.prisma-studio
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../apps/api-core/prisma:/app/prisma:ro
      - ../../apps/api-core/prisma.config.ts:/app/prisma.config.ts:ro
    environment:
      DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?schema=public
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    profiles: ["apps"]

  proctoring-cv:
    build:
      context: ../../apps/proctoring-cv
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROCTORING_CV_PORT:-8091}:8091"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
    profiles: ["apps"]

  web-student:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-student
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${STUDENT_PORT:-3001}:3000"
    profiles: ["apps"]

  web-tpo:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-tpo
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${TPO_PORT:-3002}:3000"
    profiles: ["apps"]

  web-admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-admin
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3003}:3000"
    profiles: ["apps"]

  web-verify:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-verify
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${VERIFY_PORT:-3004}:3000"
    profiles: ["apps"]

  web-auth:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-auth
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
        NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${AUTH_APP_URL:-http://localhost:3005}
      NEXT_PUBLIC_STUDENT_URL: ${STUDENT_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_TPO_URL: ${TPO_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3003}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${AUTH_PORT:-3005}:3000"
    profiles: ["apps"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDENT_HOST: ${STUDENT_HOST:-app.localhost}
      TPO_HOST: ${TPO_HOST:-tpo.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      VERIFY_HOST: ${VERIFY_HOST:-verify.localhost}
      AUTH_HOST: ${AUTH_HOST:-auth.localhost}
      API_HOST: ${API_HOST:-api.localhost}
      STUDIO_HOST: ${STUDIO_HOST:-studio.localhost}
      DB_BASIC_AUTH_USER: ${DB_BASIC_AUTH_USER:-admin}
      DB_BASIC_AUTH_HASH: ${DB_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web-student
      - web-tpo
      - web-admin
      - web-verify
      - web-auth
      - prisma-studio
    # Only one stack per host should enable profile `vps` (binds :80/:443).
    profiles: ["vps"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-smart}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      # Host 3100 (not 3030) — keep Loki on 3101 to avoid collision.
      - "127.0.0.1:${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3101}:3100"
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    profiles: ["obs"]

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: ["obs"]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

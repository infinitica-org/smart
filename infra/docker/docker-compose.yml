name: smart

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://smart:${POSTGRES_PASSWORD:-smart}@postgres:5432/smart?schema=public
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-now!!}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smart}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartsecret}
  S3_BUCKET: smart
  LOG_PRETTY: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: smart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smart}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    profiles: ["apps"]

  web-student:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-student
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3001:3000"
    profiles: ["apps"]

  web-tpo:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-tpo
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3002:3000"
    profiles: ["apps"]

  web-admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-admin
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3003:3000"
    profiles: ["apps"]

  web-verify:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web-verify
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "3004:3000"
    profiles: ["apps"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDENT_HOST: ${STUDENT_HOST:-app.localhost}
      TPO_HOST: ${TPO_HOST:-tpo.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      VERIFY_HOST: ${VERIFY_HOST:-verify.localhost}
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web-student
      - web-tpo
      - web-admin
      - web-verify
    profiles: ["apps", "vps"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-smart}
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    profiles: ["obs"]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
